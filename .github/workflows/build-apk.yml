name: Build APK

on:
  workflow_dispatch:    # 允许在页面上手动点按钮运行
  push:
    branches: [main]    # 每次更新 main 分支会自动运行

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        timeout-minutes: 8
        run: npm install --no-audit --no-fund --loglevel=http

      # 类型检查：只提示，不拦截（有类型警告时 APK 仍会继续构建）
      - name: Type check (informational)
        continue-on-error: true
        run: npm run typecheck

      # Vite 构建：Vue + TypeScript -> dist/；版本号由 vite.config.ts 从 package.json 注入
      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      # Firebase 客户端配置：可将 google-services.json 放在仓库根目录，
      # 或将其 base64 内容保存为 GitHub Actions Secret: GOOGLE_SERVICES_JSON_BASE64。
      - name: Configure Firebase for Android
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -f google-services.json ]; then
            mkdir -p android/app
            cp google-services.json android/app/google-services.json
            echo "Firebase config copied from repository."
          elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            mkdir -p android/app
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
            echo "Firebase config decoded from GitHub Secret."
          else
            echo "::warning::Firebase config missing. APK can build, but FCM registration will not work until configured."
          fi

      # Android 13+ 必须声明 POST_NOTIFICATIONS，否则系统通知静默失败
      - name: Ensure POST_NOTIFICATIONS permission
        run: |
          MAN=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'POST_NOTIFICATIONS' "$MAN"; then
            perl -0pi -e 's#(<uses-permission android:name="android.permission.INTERNET" />)#$1\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />#' "$MAN"
          fi
          grep -n 'uses-permission' "$MAN"

      # 版本号以 package.json 为唯一来源：0.3.0 -> versionName "0.3.0"，versionCode 300
      - name: Set app version from package.json
        run: |
          VER=$(node -p "require('./package.json').version")
          CODE=$(node -p "const v=require('./package.json').version.split('.').map(Number); v[0]*10000+(v[1]||0)*100+(v[2]||0)")
          APP=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode $CODE/" "$APP"
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"$VER\"/" "$APP"
          echo "版本已写入：versionName=$VER  versionCode=$CODE"
          grep -nE 'versionCode|versionName' "$APP"

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: horizon-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
