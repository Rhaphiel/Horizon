name: Build APK

on:
  workflow_dispatch:    # 允许在页面上手动点按钮运行
  push:
    branches: [main]    # 每次更新 main 分支会自动运行

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund --loglevel=http

      - name: Prepare web files
        run: |
          mkdir -p www
          if [ -f index.html ] && [ ! -f www/index.html ]; then mv index.html www/index.html; fi
          echo "Files in repo:"; ls -la . www
          test -f www/index.html || { echo "ERROR: index.html not found in the repo"; exit 1; }

      - name: Copy supabase library into the app
        run: cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/supabase.js

      - name: Create Android project
        run: npx cap add android

      # Android 13+ 必须声明 POST_NOTIFICATIONS，否则系统通知静默失败
      - name: Ensure POST_NOTIFICATIONS permission
        run: |
          MAN=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'POST_NOTIFICATIONS' "$MAN"; then
            perl -0pi -e 's#(<uses-permission android:name="android.permission.INTERNET" />)#$1\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />#' "$MAN"
          fi
          grep -n 'uses-permission' "$MAN"

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: horizon-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
