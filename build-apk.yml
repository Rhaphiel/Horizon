name: Build APK

on:
  workflow_dispatch:    # 允许在页面上手动点按钮运行
  push:
    branches: [main]    # 每次更新 main 分支会自动运行

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        timeout-minutes: 8
        run: npm install --no-audit --no-fund --loglevel=http

      # 类型检查：只提示，不拦截（有类型警告时 APK 仍会继续构建）
      - name: Type check (informational)
        continue-on-error: true
        run: npm run typecheck

      # Vite 构建：Vue + TypeScript -> dist/；版本号由 vite.config.ts 从 package.json 注入
      - name: Build web app
        run: npm run build

      # 固定签名：用仓库 Secret 里的 keystore 覆盖 runner 自动生成的 debug 签名。
      # 不加这一步，每台 runner 会生成不同的 debug key → 每次装新版都提示「未安装应用」
      - name: Use stable debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            echo "已使用 Secret 中的固定签名密钥"
          else
            echo "::warning::没有配置 DEBUG_KEYSTORE_BASE64，本次 APK 签名会与上一版不同，可能无法覆盖安装"
          fi
          ls -l "$HOME/.android/debug.keystore" || true

      - name: Create Android project
        run: npx cap add android

      # Firebase 客户端配置：可将 google-services.json 放在仓库根目录，
      # 或将其 base64 内容保存为 GitHub Actions Secret: GOOGLE_SERVICES_JSON_BASE64。
      - name: Configure Firebase for Android
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -f google-services.json ]; then
            mkdir -p android/app
            cp google-services.json android/app/google-services.json
            echo "Firebase config copied from repository."
          elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            mkdir -p android/app
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
            echo "Firebase config decoded from GitHub Secret."
          else
            echo "::warning::Firebase config missing. APK can build, but FCM registration will not work until configured."
          fi

      # 媒体/通知权限：用 Python 插到 <application> 前面，比正则替换稳（不依赖 INTERNET 那行的写法）
      # 缺 RECORD_AUDIO → WebView 的 getUserMedia 直接 Permission denied，而且不会弹系统授权框
      - name: Ensure media & notification permissions
        run: |
          python3 - <<'PY'
          import re
          path = 'android/app/src/main/AndroidManifest.xml'
          src = open(path, encoding='utf-8').read()
          need = [
              'android.permission.RECORD_AUDIO',
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.MODIFY_AUDIO_SETTINGS',
          ]
          for perm in need:
              if perm in src:
                  continue
              src = src.replace(
                  '<application',
                  f'    <uses-permission android:name="{perm}" />\n    <application',
                  1,
              )
          open(path, 'w', encoding='utf-8').write(src)
          print('manifest updated')
          PY
          grep -n 'uses-permission' android/app/src/main/AndroidManifest.xml
          grep -q 'RECORD_AUDIO' android/app/src/main/AndroidManifest.xml || (echo '::error::RECORD_AUDIO 注入失败' && exit 1)

      # 版本号以 package.json 为唯一来源：0.4.0 -> versionName "0.4.0"，versionCode 400
      - name: Set app version from package.json
        run: |
          VER=$(node -p "require('./package.json').version")
          CODE=$(node -p "const v=require('./package.json').version.split('.').map(Number); v[0]*10000+(v[1]||0)*100+(v[2]||0)")
          APP=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode $CODE/" "$APP"
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"$VER\"/" "$APP"
          echo "版本已写入：versionName=$VER  versionCode=$CODE"
          grep -nE 'versionCode|versionName' "$APP"

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: horizon-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
